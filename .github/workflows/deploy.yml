name: Deploy production

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: oneteam-news-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    environment: production

    env:
      SSH_HOST: ${{ secrets.SSH_HOST }}
      SSH_PORT: ${{ secrets.SSH_PORT || '22' }}
      SSH_USER_PRODUCTION: ${{ secrets.SSH_USER_PRODUCTION }}
      WORK_DIR_PRODUCTION: ${{ secrets.WORK_DIR_PRODUCTION }}
      HEALTHCHECK_URL: ${{ vars.HEALTHCHECK_URL || 'https://oneteam-news.de/index.php?r=/getconfig' }}
      PHP_FPM_SERVICE: ${{ vars.PHP_FPM_SERVICE || 'php8.4-fpm' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate deployment configuration
        run: |
          : "${SSH_HOST:?Missing secret SSH_HOST}"
          : "${SSH_PORT:?Missing secret SSH_PORT}"
          : "${SSH_USER_PRODUCTION:?Missing secret SSH_USER_PRODUCTION}"
          : "${WORK_DIR_PRODUCTION:?Missing secret WORK_DIR_PRODUCTION}"

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, zip
          coverage: none

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install production PHP dependencies
        run: |
          composer install \
            --no-dev \
            --no-interaction \
            --prefer-dist \
            --classmap-authoritative

      - name: Build frontend
        run: |
          npm ci
          npm run build

      - name: Prepare production artifact
        run: |
          scripts/build-release.sh

          release_id="$(date -u +%Y%m%d%H%M%S)-${GITHUB_SHA::7}"
          echo "RELEASE_ID=$release_id" >> "$GITHUB_ENV"

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          : "${SSH_PRIVATE_KEY:?Missing secret SSH_PRIVATE_KEY}"
          install -d -m 0700 "$HOME/.ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/deploy_key"
          chmod 0600 "$HOME/.ssh/deploy_key"

      - name: Upload release archive
        run: |
          scp \
            -i "$HOME/.ssh/deploy_key" \
            -P "$SSH_PORT" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=accept-new \
            build/oneteam-news-filegator.tar.gz \
            "$SSH_USER_PRODUCTION@$SSH_HOST:$WORK_DIR_PRODUCTION/incoming/$RELEASE_ID.tar.gz"

      - name: Activate release
        run: |
          ssh \
            -i "$HOME/.ssh/deploy_key" \
            -p "$SSH_PORT" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=accept-new \
            "$SSH_USER_PRODUCTION@$SSH_HOST" \
            "bash -s -- '$RELEASE_ID' '$WORK_DIR_PRODUCTION' '$HEALTHCHECK_URL' '$PHP_FPM_SERVICE'" \
            < scripts/deploy.sh
